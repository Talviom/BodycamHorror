plugins {
    id 'eclipse'
    id 'idea'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
}

version = mod_version
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: mapping_channel, version: mapping_version
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // Миксин для Oculus (свои uniform-переменные шейдера). В jar он подключается через MANIFEST.
            arg '-mixin.config=bodycamhorror.mixins.json'
            mods {
                "${mod_id}" {
                    source sourceSets.main
                }
            }
        }
        client {
            // Проверка без человека: gradlew runClient -PbhTest=tools/tests/<сценарий>.txt
            // Клиент сам заходит в мир "New World", сервер выполняет сценарий (см. bots/TestScript.java).
            if (project.hasProperty('bhTest')) {
                property 'bh.testScript', project.file(project.property('bhTest')).absolutePath
                args '--quickPlaySingleplayer', 'New World'
            }
            // Размер окна как у игрока: gradlew runClient -PbhSize=1920x1080 (масштаб интерфейса берётся из run/options.txt).
            if (project.hasProperty('bhSize')) {
                def size = project.property('bhSize').toString().split('x')
                args '--width', size[0], '--height', size[1]
            }
            // Второе окно игры для проверки по сети: gradlew runClient -PbhJoin=localhost:25565 [-PbhName=Dev2]
            // Своя папка run2 (настройки, логи, скриншоты), само заходит на сервер хоста и снимает кадры (bots/RemoteShots.java).
            if (project.hasProperty('bhJoin')) {
                workingDirectory project.file('run2')
                // Не --quickPlayMultiplayer: с ним Forge не узнаёт модовый сервер и вход обрывается по тайм-ауту.
                property 'bh.join', project.property('bhJoin')
                args '--username', project.findProperty('bhName') ?: 'Dev2'
                property 'bh.remoteShots', 'true'
            }
            // Клиент с шейдерами: gradlew runClient -PbhShaders (вместе с -PbhTest сам снимает скриншоты).
            // Embeddium и Oculus берутся из папки модов игры, см. dependencies.
            // Чужие моды из jar (GeckoLib, а с -PbhShaders ещё Embeddium и Oculus) ждут имена SRG в своих миксинах:
            // без пересчёта refmap dev-клиент падает при запуске (GeckoLib TextureManagerMixin).
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${project.buildDir}/createSrgToMcp/output.srg"
        }
        server {
            args '--nogui'
            // Готовый мир для сборки: tools/world/make-world.ps1 (gradlew runServer -PbhServerDir=... -PbhTest=...).
            if (project.hasProperty('bhServerDir')) {
                workingDirectory project.file(project.property('bhServerDir'))
            }
            if (project.hasProperty('bhTest')) {
                property 'bh.testScript', project.file(project.property('bhTest')).absolutePath
            }
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = 'henkelmax.public'
        url = 'https://maven.maxhenkel.de/repository/public'
    }
    // Oculus и Embeddium берутся из папки модов игры: для компиляции миксина и для клиента с шейдерами.
    flatDir {
        dirs project.findProperty('bhGameMods') ?: 'D:/Minecraft/game/mods', "$buildDir/bhmods"
    }
}

// Для -PbhFurniture: копии jar из папки модов игры с именами, которые понимает flatDir (только чтение оттуда).
if (project.hasProperty('bhFurniture')) {
    def gameMods = file(project.findProperty('bhGameMods') ?: 'D:/Minecraft/game/mods')
    def bhMods = file("$buildDir/bhmods")
    bhMods.mkdirs()
    [['ModernxlSurvival_1.3.2_v1.20.1.jar', 'modernxl_ii-1.3.2.jar'],
     ['MOAdecor SCIENCE 1.20.1.jar', 'moa_decor_science-1.20.1.jar']].each { pair ->
        def src = new File(gameMods, pair[0])
        def dst = new File(bhMods, pair[1])
        if (src.exists() && (!dst.exists() || dst.length() != src.length())) {
            java.nio.file.Files.copy(src.toPath(), dst.toPath(), java.nio.file.StandardCopyOption.REPLACE_EXISTING)
        }
    }
}

dependencies {
    minecraft "net.minecraftforge:forge:${minecraft_version}-${forge_version}"

    // Simple Voice Chat API: нужен только для компиляции рации, в игре его даёт сам мод voicechat.
    compileOnly "de.maxhenkel.voicechat:voicechat-api:${voicechat_api_version}"

    // GeckoLib: модель и анимации Жильца. В игре стоит тот же jar (geckolib-forge-1.20.1-4.8.4).
    implementation fg.deobf('blank:geckolib-forge-1.20.1:4.8.4')

    // Классы Oculus нужны только для компиляции миксина; в игре их даёт сам Oculus, а без него миксин пропускается.
    compileOnly fg.deobf('blank:oculus-mc1.20.1:1.8.0')

    // Только для тестового клиента с шейдерами (-PbhShaders): те же jar, что стоят в игре.
    if (project.hasProperty('bhShaders')) {
        runtimeOnly fg.deobf('blank:embeddium:0.3.31+mc1.20.1')
        runtimeOnly fg.deobf('blank:oculus-mc1.20.1:1.8.0')
    }
    // Мебель Macaw's для точек кассеты (0.9): без неё FacilityBuilder ставит бочки.
    // Нужна готовым мирам (tools/world/make-world.ps1) и проверке мебели: -PbhFurniture.
    // Лобби 1.0 (детали): Macaw's Doors, Yuushya (нужен Architectury), ModernxlSurvival, MOAdecor SCIENCE.
    // Jar с пробелами и без версии в имени копируются в build/bhmods под понятными именами (копирование выше).
    if (project.hasProperty('bhFurniture')) {
        runtimeOnly fg.deobf('blank:mcw-furniture:3.4.1-mc1.20.1forge')
        runtimeOnly fg.deobf('blank:mcw-doors:1.1.5-mc1.20.1forge')
        runtimeOnly fg.deobf('blank:architectury:9.2.14-forge')
        runtimeOnly fg.deobf('blank:yuushya-1.20.1-forge:2.3.0')
        runtimeOnly fg.deobf('blank:modernxl_ii:1.3.2')
        runtimeOnly fg.deobf('blank:moa_decor_science:1.20.1')
    }
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version   : minecraft_version, minecraft_version_range: minecraft_version_range,
            forge_version       : forge_version, forge_version_range: forge_version_range,
            loader_version_range: loader_version_range,
            mod_id              : mod_id, mod_name: mod_name, mod_license: mod_license, mod_version: mod_version,
            mod_authors         : mod_authors, mod_description: mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'     : mod_id,
                'Specification-Vendor'    : mod_authors,
                'Specification-Version'   : '1',
                'Implementation-Title'    : project.name,
                'Implementation-Version'  : project.jar.archiveVersion,
                'Implementation-Vendor'   : mod_authors,
                'MixinConfigs'            : 'bodycamhorror.mixins.json',
        ])
    }
    finalizedBy 'reobfJar'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
